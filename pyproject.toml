[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caliber-eval"
dynamic = ["version"]
description = "Statistical decision layer for AI/LLM evaluations"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Caliber contributors" }]
keywords = ["llm", "eval", "statistics", "ab-testing", "bootstrap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pydantic>=2.0",
    "typer>=0.9",
]

[project.optional-dependencies]
braintrust = ["httpx>=0.25"]
langfuse = ["langfuse>=2.0"]
langsmith = ["langsmith>=0.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "mypy>=1.8",
    "httpx>=0.25",
]

[project.scripts]
caliber = "caliber.cli:app"

[project.urls]
Homepage = "https://github.com/karyampudilikhit/caliber-eval"
Repository = "https://github.com/karyampudilikhit/caliber-eval"
Issues = "https://github.com/karyampudilikhit/caliber-eval/issues"

[tool.hatch.version]
path = "caliber/version.py"

[tool.hatch.build.targets.wheel]
packages = ["caliber"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks contain deliberately compact demo code; we verify execution via
# examples/_verify_notebooks.py instead of linting them.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: allow Greek letters and en-dashes in identifiers/docstrings/comments —
# this is a stats library; Δ, α, σ are standard mathematical notation.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
# Use the runtime Python version so mypy can parse modern numpy stubs
# (which use PEP 695 `type` syntax on Python 3.12+).
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
